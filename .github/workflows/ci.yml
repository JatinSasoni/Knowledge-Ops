name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# If you push twice quickly, cancel the older run instead of wasting minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, format, typecheck
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # prisma.config.ts reads DATABASE_URL. Generate doesn't connect,
      # but the value must exist. This is a dummy, NOT a real secret.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
