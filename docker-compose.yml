services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: knowledge_ops
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledge -d knowledge_ops"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://knowledge:${POSTGRES_PASSWORD}@postgres:5432/knowledge_ops?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  storage:
    image: rustfs/rustfs@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000" # S3 API: the browser uploads here
      - "9001:9001" # web console
    volumes:
      - storagedata:/data

  storage-init:
    image: amazon/aws-cli:latest
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://storage:9000 s3api list-buckets > /dev/null 2>&1; do sleep 2; done;
      aws --endpoint-url http://storage:9000 s3 mb s3://documents || true;
      aws --endpoint-url http://storage:9000 s3api put-bucket-cors --bucket documents --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"http://localhost:5173\",\"http://localhost:8080\"],\"AllowedMethods\":[\"PUT\",\"GET\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3000}]}'
      "

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://knowledge:${POSTGRES_PASSWORD}@postgres:5432/knowledge_ops?schema=public
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      S3_ENDPOINT: http://storage:9000 # API → storage, inside Docker
      S3_PUBLIC_ENDPOINT: http://localhost:9000 # browser → storage
      S3_REGION: us-east-1
      S3_BUCKET: documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  storagedata:
